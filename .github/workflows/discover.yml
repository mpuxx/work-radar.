name: discover
# Weekly source discovery: Monday 05:20 UTC.
on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: workradar-state
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      WORKRADAR_DB: state/workradar.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore state
        run: |
          mkdir -p state
          if git fetch --depth 1 origin state 2>/dev/null; then git --work-tree=state checkout origin/state -- . || true; fi
          # State is stored gzipped so it stays far below GitHub's 100 MB file limit
          for g in state/*.gz; do if [ -e "$g" ]; then gunzip -f "$g"; fi; done
      - run: python -m workradar seed && python -m workradar discover
      - name: Save state
        run: |
          cd state
          cp ../SOURCE_REGISTRY.csv . 2>/dev/null || true
          for big in workradar.sqlite3 reed_details.json; do if [ -f "$big" ]; then gzip -f "$big"; fi; done
          ls -la
          git init -q -b state && git add -A
          git -c user.name="work-radar bot" -c user.email="actions@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state
      - name: Start a collection with the new sources
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run collect.yml -R "${{ github.repository }}" --ref main
