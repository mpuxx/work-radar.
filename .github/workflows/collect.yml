name: collect
# Every 15 minutes (GitHub may start scheduled runs a few minutes late at busy times).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Check now: a source_id (e.g. greenhouse:monzo) or 'all'"
        required: false
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
# Never two collections at once; a new one waits for the old one.
concurrency:
  group: workradar-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      WORKRADAR_DB: state/workradar.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore state (state branch holds only the latest database)
        run: |
          mkdir -p state
          if git fetch --depth 1 origin state 2>/dev/null; then git --work-tree=state checkout origin/state -- . || true; fi
          ls -la state
      - name: First run seeds the registry and the test account
        run: |
          if [ ! -f state/workradar.sqlite3 ]; then python -m workradar seed && python -m workradar discover; fi
      - name: Collect
        run: |
          if [ -n "${{ github.event.inputs.source }}" ]; then python -m workradar check-now "${{ github.event.inputs.source }}"; else python -m workradar collect; fi
      - name: Save state
        if: always()
        run: |
          cd state
          cp ../SOURCE_REGISTRY.csv . 2>/dev/null || true
          git init -q -b state && git add -A
          git -c user.name="work-radar bot" -c user.email="actions@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Backup clock. GitHub's own schedule can start late or not at all on new repositories.
  # If no scheduled run has happened in the last 30 minutes, this starts the next check 15 minutes after this one began.
  chain:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait until 15 minutes after this run started
        run: |
          start=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at | xargs -I{} date -d {} +%s)
          wait=$(( start + 900 - $(date +%s) ))
          echo "waiting ${wait}s"; if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
      - name: Start the next check unless GitHub's schedule is working
        run: |
          since=$(date -u -d '-30 min' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$REPO/actions/workflows/collect.yml/runs?event=schedule&created=>$since" --jq .total_count)
          queued=0
          for st in queued pending waiting; do
            for wf in collect.yml discover.yml; do
              q=$(gh api "repos/$REPO/actions/workflows/$wf/runs?status=$st" --jq .total_count); queued=$((queued + q))
            done
          done
          disc=$(gh api "repos/$REPO/actions/workflows/discover.yml/runs?status=in_progress" --jq .total_count)
          echo "scheduled runs in last 30 min: $n; waiting runs: $queued; discovery running: $disc"
          # Discovery starts the next collection itself when it finishes, so don't queue one behind it (it would cancel it).
          if [ "$n" = "0" ] && [ "$queued" = "0" ] && [ "$disc" = "0" ]; then gh workflow run collect.yml -R "$REPO" --ref main; fi
